# Builds Superior IPTV Player for Windows and its installer.
#
# The source lives in SuperiorIPTV-windows.tar.gz. Uploading a new copy of that file starts a build:
#   1. "Unpack source" copies the bundle's contents into the windows/ folder so the code can be browsed.
#   2. "Windows app" runs the unit tests, compiles the app, runs its self-test (the app is driven through
#      its screens against a pretend TV provider), builds the installer and posts it under Releases.
#   3. The test results and screenshots are written to the ci-logs-windows branch.
name: Windows

on:
  push:
    branches: [main]
    paths: ['SuperiorIPTV-windows.tar.gz']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: true

jobs:
  unpack:
    name: Unpack source
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Replace the browsable windows/ folder with the bundle's contents
        run: |
          set -e
          rm -rf windows
          tar -xzf SuperiorIPTV-windows.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A windows
          git diff --cached --quiet || git commit -q -m "Unpack Windows source bundle (build ${{ github.run_number }})"
          git pull -q --rebase || true
          git push

  build:
    name: Windows app
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the source bundle
        run: tar -xzf SuperiorIPTV-windows.tar.gz

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        id: tests
        continue-on-error: true
        working-directory: windows
        run: |
          dotnet test tests/Core.Tests/Core.Tests.csproj -c Release --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath ../test.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Compile the app
        id: compile
        working-directory: windows
        run: |
          dotnet publish src/App/App.csproj -c Release -o publish -p:Version=1.0.${{ github.run_number }} 2>&1 | Tee-Object -FilePath ../build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Self-test (drives the real app through its screens)
        id: selftest
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 9
        working-directory: windows
        run: |
          try { Set-DisplayResolution -Width 1600 -Height 900 -Force | Out-Null } catch { Write-Host "Could not change the screen size: $_" }
          $out = Join-Path $PWD "selftest-out"
          $p = Start-Process -FilePath "publish\SuperiorIPTVPlayer.exe" -ArgumentList "--self-test", "`"$out`"", "`"$PWD\samples`"" -PassThru
          if (-not $p.WaitForExit(7 * 60 * 1000)) { $p.Kill(); Write-Host "Self-test timed out"; exit 1 }
          Write-Host "Self-test exit code: $($p.ExitCode)"
          if (Test-Path "$out\selftest.log") { Get-Content "$out\selftest.log" }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Build the installer
        id: installer
        if: steps.compile.outcome == 'success'
        working-directory: windows
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" installer\setup.iss 2>&1 | Tee-Object -FilePath ../installer.log | Select-Object -Last 15
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\SuperiorIPTVPlayer-Setup.exe | Format-List Name, Length

      - name: Upload the installer
        if: steps.installer.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SuperiorIPTVPlayer-Setup
          path: windows/dist/SuperiorIPTVPlayer-Setup.exe
          if-no-files-found: error

      - name: Post the installer under Releases
        id: release
        if: steps.installer.outcome == 'success' && steps.tests.outcome == 'success' && steps.selftest.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-build-${{ github.run_number }}"
          $notes = "Superior IPTV Player for Windows 10 and 11 (64-bit), build ${{ github.run_number }}. Download SuperiorIPTVPlayer-Setup.exe and run it. The installer is not code-signed: if Windows SmartScreen appears, choose More info, then Run anyway."
          gh release create $tag "windows/dist/SuperiorIPTVPlayer-Setup.exe" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Superior IPTV Player for Windows (build ${{ github.run_number }})" --notes $notes --latest

      - name: Write the report
        if: always()
        run: |
          New-Item -ItemType Directory -Force report | Out-Null
          $lines = @()
          $lines += "run: ${{ github.run_number }}"
          $lines += "run_id: ${{ github.run_id }}"
          $lines += "commit: ${{ github.sha }}"
          $lines += "tests: ${{ steps.tests.outcome }}"
          $lines += "compile: ${{ steps.compile.outcome }}"
          $lines += "selftest: ${{ steps.selftest.outcome }}"
          $lines += "installer: ${{ steps.installer.outcome }}"
          $lines += "release: ${{ steps.release.outcome }}"
          if (Test-Path windows\dist\SuperiorIPTVPlayer-Setup.exe) { $lines += "installer_bytes: $((Get-Item windows\dist\SuperiorIPTVPlayer-Setup.exe).Length)" }
          $lines | Set-Content report\status.txt
          $root = [regex]::Escape($PWD.Path + '\')
          if (Test-Path test.log) {
            Get-Content test.log | Select-String -Pattern "error|Failed|Passed!|Failed!|Total tests|\[FAIL\]|Assert" | ForEach-Object { $_.Line -replace $root, '' } | Select-Object -Unique -First 200 | Set-Content report\tests.txt
            Get-Content test.log -Tail 40 | Add-Content report\tests.txt
          }
          if (Test-Path build.log) {
            Get-Content build.log | Select-String -Pattern "error |warning CS8|Build succeeded|Build FAILED" | ForEach-Object { $_.Line -replace $root, '' } | Select-Object -Unique -First 300 | Set-Content report\build.txt
            Get-Content build.log -Tail 15 | Add-Content report\build.txt
          }
          if (Test-Path installer.log) { Get-Content installer.log -Tail 25 | Set-Content report\installer.txt }
          if (Test-Path windows\selftest-out) {
            Copy-Item windows\selftest-out\*.log report\ -ErrorAction SilentlyContinue
            Copy-Item windows\selftest-out\*.png report\ -ErrorAction SilentlyContinue
            if (Test-Path windows\selftest-out\data\errors.log) { Copy-Item windows\selftest-out\data\errors.log report\app-errors.log }
          }
          Get-Content report\status.txt
          "### Windows build" | Add-Content $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content report\status.txt | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path report\selftest.log) { Get-Content report\selftest.log | Add-Content $env:GITHUB_STEP_SUMMARY }
          if (Test-Path report\build.txt) { Get-Content report\build.txt -TotalCount 80 | Add-Content $env:GITHUB_STEP_SUMMARY }
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Push the report to the ci-logs-windows branch
        if: always()
        shell: bash
        run: |
          cd report
          git init -q -b ci-logs-windows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Windows results for build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-windows

      - name: Fail the run if a stage failed
        if: steps.tests.outcome != 'success' || steps.compile.outcome != 'success' || steps.selftest.outcome != 'success' || steps.installer.outcome != 'success'
        run: exit 1
