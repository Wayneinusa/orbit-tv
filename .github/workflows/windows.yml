# Builds Superior IPTV Player for Windows and its installer.
#
# The source lives in SuperiorIPTV-windows.tar.gz. Uploading a new copy of that file starts a build:
#   1. "Unpack source" copies the bundle's contents into the windows/ folder so the code can be browsed.
#   2. "Build installer" runs the unit tests, compiles the app and builds the installer.
#   3. "Self-test on Windows" starts the real app on a Windows machine and drives it through its screens
#      against a pretend TV provider (live streams that drop, downloads that are cut off, and so on).
#   4. "Release" posts the installer on the repository's Releases page.
# Results are written to the ci-logs-windows and ci-logs-selftest branches.
name: Windows

on:
  push:
    branches: [main]
    paths: ['SuperiorIPTV-windows.tar.gz']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: true

jobs:
  unpack:
    name: Unpack source
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Replace the browsable windows/ folder with the bundle's contents
        run: |
          set -e
          rm -rf windows
          tar -xzf SuperiorIPTV-windows.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A windows
          git diff --cached --quiet || git commit -q -m "Unpack Windows source bundle (build ${{ github.run_number }})"
          git pull -q --rebase || true
          git push

  build:
    name: Build installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the source bundle
        run: tar -xzf SuperiorIPTV-windows.tar.gz

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        id: tests
        continue-on-error: true
        working-directory: windows
        run: |
          set -o pipefail
          dotnet test tests/Core.Tests/Core.Tests.csproj -c Release --logger "console;verbosity=normal" 2>&1 | tee ../test.log

      - name: Compile the app for Windows
        id: compile
        working-directory: windows
        run: |
          set -o pipefail
          dotnet publish src/App/App.csproj -c Release -o publish -p:EnableWindowsTargeting=true -p:Version=1.0.${{ github.run_number }} 2>&1 | tee ../build.log
          test -f publish/SuperiorIPTVPlayer.exe
          test -d publish/libvlc/win-x64
          du -sh publish | tee -a ../build.log

      - name: Build the installer
        id: installer
        working-directory: windows
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis > /dev/null
          mkdir -p dist
          makensis -V2 -DAPPVERSION=1.0.${{ github.run_number }} installer/setup.nsi 2>&1 | tee ../installer.log
          ls -la dist | tee -a ../installer.log

      - name: Upload the installer
        if: steps.installer.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SuperiorIPTVPlayer-Setup
          path: windows/dist/SuperiorIPTVPlayer-Setup.exe
          if-no-files-found: error

      - name: Keep the compiled app for the self-test
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-files
          path: windows/publish
          retention-days: 3
          compression-level: 1

      - name: Push the report to the ci-logs-windows branch
        if: always()
        run: |
          mkdir -p report
          {
            echo "run: ${{ github.run_number }}"
            echo "run_id: ${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            echo "tests: ${{ steps.tests.outcome }}"
            echo "compile: ${{ steps.compile.outcome }}"
            echo "installer: ${{ steps.installer.outcome }}"
            [ -f windows/dist/SuperiorIPTVPlayer-Setup.exe ] && echo "installer_bytes: $(stat -c %s windows/dist/SuperiorIPTVPlayer-Setup.exe)"
            date -u
          } > report/status.txt
          if [ -f test.log ]; then
            { grep -E "error|Failed |Passed!|Failed!|Total tests|Passed:|Failed:|\[FAIL\]|Assert" test.log | sed "s#$PWD/##g" | awk '!seen[$0]++' | head -200; echo "--- last lines"; tail -n 30 test.log; } > report/tests.txt || true
          fi
          if [ -f build.log ]; then
            { grep -E "error |warning NETSDK|Build succeeded|Build FAILED" build.log | sed "s#$PWD/##g" | awk '!seen[$0]++' | head -300; echo "--- last lines"; tail -n 15 build.log; } > report/build.txt || true
          fi
          [ -f installer.log ] && tail -n 30 installer.log > report/installer.txt || true
          cat report/status.txt
          { echo '### Windows build'; echo '```'; cat report/status.txt; [ -f report/build.txt ] && head -n 60 report/build.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cd report
          git init -q -b ci-logs-windows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Windows build results ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-windows

      - name: Fail the run if a stage failed
        if: steps.tests.outcome != 'success' || steps.compile.outcome != 'success' || steps.installer.outcome != 'success'
        run: exit 1

  selftest:
    name: Self-test on Windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    outputs:
      passed: ${{ steps.overall.outputs.passed }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the source bundle (for the sample clips)
        run: tar -xzf SuperiorIPTV-windows.tar.gz

      - uses: actions/download-artifact@v4
        with:
          name: app-files
          path: windows/publish

      - name: Run the app's self-test
        id: run
        continue-on-error: true
        working-directory: windows
        run: |
          try { Set-DisplayResolution -Width 1600 -Height 900 -Force | Out-Null } catch { Write-Host "Could not change the screen size: $_" }
          $out = Join-Path $PWD "selftest-out"
          $p = Start-Process -FilePath "publish\SuperiorIPTVPlayer.exe" -ArgumentList "--self-test", "`"$out`"", "`"$PWD\samples`"" -PassThru
          if (-not $p.WaitForExit(9 * 60 * 1000)) { $p.Kill(); Write-Host "Self-test timed out"; exit 1 }
          Write-Host "Self-test exit code: $($p.ExitCode)"
          if (Test-Path "$out\selftest.log") { Get-Content "$out\selftest.log" }
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/download-artifact@v4
        with:
          name: SuperiorIPTVPlayer-Setup
          path: installer-test

      - name: Install and uninstall the app with the real installer
        id: install
        continue-on-error: true
        run: |
          $log = Join-Path $PWD "install-test.log"
          function Say($text) { Write-Host $text; Add-Content -Path $log -Value $text }
          try {
            $setup = Join-Path $PWD "installer-test\SuperiorIPTVPlayer-Setup.exe"
            Say "Installer size: $((Get-Item $setup).Length) bytes"
            $p = Start-Process -FilePath $setup -ArgumentList "/S" -PassThru
            if (-not $p.WaitForExit(5 * 60 * 1000)) { $p.Kill(); throw "The installer timed out" }
            Say "Installer exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "The installer reported an error" }
            $dir = Join-Path $env:LOCALAPPDATA "Programs\Superior IPTV Player"
            foreach ($item in @("SuperiorIPTVPlayer.exe", "app.ico", "Uninstall.exe", "libvlc\win-x64\libvlc.dll")) {
              if (-not (Test-Path (Join-Path $dir $item))) { throw "Missing after installing: $item" }
            }
            $startMenu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Superior IPTV Player.lnk"
            $desktop = Join-Path ([Environment]::GetFolderPath("Desktop")) "Superior IPTV Player.lnk"
            if (-not (Test-Path $startMenu)) { throw "The Start menu shortcut is missing" }
            if (-not (Test-Path $desktop)) { throw "The desktop shortcut is missing" }
            $entry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\SuperiorIPTVPlayer"
            Say "Listed in Windows as: $($entry.DisplayName) $($entry.DisplayVersion)"
            $files = (Get-ChildItem $dir -Recurse -File | Measure-Object -Property Length -Sum)
            Say "Installed $($files.Count) files, $([math]::Round($files.Sum / 1MB)) MB, into $dir"
            # The installed copy must start and stay running.
            $app = Start-Process -FilePath (Join-Path $dir "SuperiorIPTVPlayer.exe") -PassThru
            Start-Sleep -Seconds 12
            if ($app.HasExited) { throw "The installed app exited by itself (code $($app.ExitCode))" }
            $app.Refresh()
            Say "The installed app started and kept running (window title: '$($app.MainWindowTitle)')"
            $app.Kill(); $app.WaitForExit(10000) | Out-Null
            Start-Sleep -Seconds 2
            $u = Start-Process -FilePath (Join-Path $dir "Uninstall.exe") -ArgumentList "/S", "_?=$dir" -PassThru
            if (-not $u.WaitForExit(3 * 60 * 1000)) { $u.Kill(); throw "The uninstaller timed out" }
            Say "Uninstaller exit code: $($u.ExitCode)"
            if (Test-Path (Join-Path $dir "SuperiorIPTVPlayer.exe")) { throw "The app is still there after uninstalling" }
            if (Test-Path (Join-Path $dir "libvlc")) { throw "The video engine is still there after uninstalling" }
            if (Test-Path $startMenu) { throw "The Start menu shortcut is still there after uninstalling" }
            if (Test-Path $desktop) { throw "The desktop shortcut is still there after uninstalling" }
            Say "Uninstall removed the app and its shortcuts"
            Say "INSTALL TEST PASSED"
          } catch {
            Say "INSTALL TEST FAILED: $_"
            exit 1
          }

      - name: Record the overall result
        id: overall
        if: steps.run.outcome == 'success' && steps.install.outcome == 'success'
        run: |
          "passed=true" | Add-Content $env:GITHUB_OUTPUT

      - name: Push the results to the ci-logs-selftest branch
        if: always()
        shell: bash
        run: |
          mkdir -p report
          {
            echo "run: ${{ github.run_number }}"
            echo "commit: ${{ github.sha }}"
            echo "selftest: ${{ steps.run.outcome }}"
            echo "install_test: ${{ steps.install.outcome }}"
            date -u
          } > report/status.txt
          cp windows/selftest-out/*.log report/ 2>/dev/null || true
          cp install-test.log report/ 2>/dev/null || true
          cp windows/selftest-out/*.png report/ 2>/dev/null || true
          cp windows/selftest-out/data/errors.log report/app-errors.log 2>/dev/null || true
          { echo '### Self-test'; echo '```'; cat report/status.txt; cat report/selftest.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cd report
          git init -q -b ci-logs-selftest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Self-test results ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-selftest

      - name: Fail the job if a check failed
        if: steps.run.outcome != 'success' || steps.install.outcome != 'success'
        run: exit 1

  release:
    name: Release
    needs: [build, selftest]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SuperiorIPTVPlayer-Setup
      - name: Post the installer under Releases
        env:
          GH_TOKEN: ${{ github.token }}
          SELFTEST: ${{ needs.selftest.outputs.passed }}
        run: |
          tag="windows-build-${{ github.run_number }}"
          how="Download SuperiorIPTVPlayer-Setup.exe and run it. The installer is not code-signed: if Windows SmartScreen appears, choose More info, then Run anyway."
          if [ "$SELFTEST" = "true" ]; then
            gh release create "$tag" SuperiorIPTVPlayer-Setup.exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
              --title "Superior IPTV Player for Windows (build ${{ github.run_number }})" \
              --notes "Superior IPTV Player for Windows 10 and 11 (64-bit). Unit tests, the app's self-test on Windows and an install/uninstall test passed for this build. $how"
          else
            gh release create "$tag" SuperiorIPTVPlayer-Setup.exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
              --title "Superior IPTV Player for Windows (build ${{ github.run_number }}, self-test not passed)" \
              --notes "Superior IPTV Player for Windows 10 and 11 (64-bit). Unit tests passed, but the self-test or the install test on Windows did not pass or could not run for this build. $how"
          fi
